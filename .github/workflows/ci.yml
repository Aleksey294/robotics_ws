name: PR02

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Compile launch file
        run: python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Build turtle_bringup
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup

      - name: Verify installed launch file
        run: test -f install/turtle_bringup/share/turtle_bringup/launch/sim.launch.py

      - name: Validate evidence
        run: |
          python3 -m json.tool evidence/pr02/report.json >/dev/null
          test -s AI_USAGE.md
          test -s evidence/pr02/build-empty.txt
          test -s evidence/pr02/build.txt
          test -s evidence/pr02/commands.md
          test -s evidence/pr02/types.md

      - name: Run course checker when available
        run: |
          if test -f .course-kit/v1/tools/check_practice.py; then
            python3 .course-kit/v1/tools/check_practice.py PR02 --submission .
          else
            echo "Course kit is not included; build and structural checks completed."
          fi
