name: PR04

on:
  push:
  pull_request:

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w12-525e86f818ff.tar.gz
  COURSE_KIT_SHA256: 525e86f818ffed166e7f7b67cc87fdd3f3ea840d13aa90e76bde9fda0f3c9c5a
  ROS_DOMAIN_ID: '184'
  ROS_LOG_DIR: /tmp/pr04-ros-logs

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install package and experiment dependencies
        run: |
          apt-get update
          apt-get install -y ros-jazzy-turtlesim ros-jazzy-geometry-msgs \
            ros-jazzy-rcl-interfaces ros-jazzy-std-srvs \
            ros-jazzy-ament-copyright ros-jazzy-ament-flake8 ros-jazzy-ament-pep257 \
            python3-pytest python3-pytest-cov python3-yaml \
            python3-colcon-common-extensions

      - name: Download pinned course kit and verify SHA-256
        run: |
          mkdir -p .course-kit
          curl -fsS "$COURSE_KIT_URL" -o /tmp/pr04-course-kit.tar.gz
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/pr04-course-kit.tar.gz | sha256sum -c -
          tar -xzf /tmp/pr04-course-kit.tar.gz -C .course-kit

      - name: Build patrol and turtle_bringup
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol

      - name: Test packages
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Verify live parameters and stream
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tools/record_pr04.py --output /tmp/pr04-ci/commands.md

      - name: Validate PR04 evidence with official checker
        run: python3 .course-kit/v1/tools/check_practice.py PR04 --submission .

      - name: Upload live experiment and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr04-checks
          path: |
            /tmp/pr04-ci/
            log/latest_test/
