name: PR03

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Compile node and launch file
        run: |
          python3 -m py_compile src/patrol/patrol/patrol.py
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Build patrol and turtle_bringup
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol

      - name: Verify installed packages and executable
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 pkg prefix patrol
          ros2 pkg executables patrol
          test -x install/patrol/lib/patrol/patrol
          test -f install/turtle_bringup/share/turtle_bringup/launch/sim.launch.py

      - name: Test patrol
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select patrol --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose --test-result-base build/patrol

      - name: Validate evidence
        run: |
          python3 -m json.tool evidence/pr03/report.json >/dev/null
          test -s AI_USAGE.md
          test -s evidence/pr03/demo.md
          test -s evidence/pr03/tests.txt

      - name: Run course checker when available
        run: |
          if test -f .course-kit/v1/tools/check_practice.py; then
            python3 .course-kit/v1/tools/check_practice.py PR03 --submission .
          else
            echo "Course kit is not included; build and structural checks completed."
          fi
