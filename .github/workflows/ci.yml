name: PR06

on:
  push:
  pull_request:

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w12-525e86f818ff.tar.gz
  COURSE_KIT_SHA256: 525e86f818ffed166e7f7b67cc87fdd3f3ea840d13aa90e76bde9fda0f3c9c5a
  ROS_DOMAIN_ID: '203'
  ROS_LOG_DIR: /tmp/pr06-ros-logs

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install package and verification dependencies
        run: |
          apt-get update
          apt-get install -y ros-jazzy-turtlesim ros-jazzy-geometry-msgs \
            ros-jazzy-rcl-interfaces ros-jazzy-std-srvs \
            ros-jazzy-ros2bag ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-robot-state-publisher ros-jazzy-rviz2 ros-jazzy-xacro \
            ros-jazzy-tf2-ros ros-jazzy-tf2-tools ros-jazzy-urdfdom \
            ros-jazzy-ament-copyright ros-jazzy-ament-flake8 ros-jazzy-ament-pep257 \
            python3-pytest python3-pytest-cov python3-yaml python3-numpy python3-pyqt5 \
            python3-colcon-common-extensions graphviz xvfb xauth x11-utils \
            libgl1-mesa-dri libglx-mesa0

      - name: Download pinned course kit and verify SHA-256
        run: |
          mkdir -p .course-kit
          curl -fsS "$COURSE_KIT_URL" -o /tmp/pr06-course-kit.tar.gz
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/pr06-course-kit.tar.gz | sha256sum -c -
          tar -xzf /tmp/pr06-course-kit.tar.gz -C .course-kit

      - name: Build packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Test packages and model structure
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test src/course_bringup/test src/course_description/test
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Verify live tf durability, geometry and RViz
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ROS_DOMAIN_ID=204 QT_SCALE_FACTOR=1 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s "-screen 0 1400x1000x24" \
            python3 tools/record_pr06.py --output /tmp/pr06-ci --rviz

      - name: Validate PR06 evidence with official checker
        run: python3 .course-kit/v1/tools/check_practice.py PR06 --submission .

      - name: Upload model, tf and RViz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr06-checks
          path: |
            /tmp/pr06-ci/
            log/latest_test/
